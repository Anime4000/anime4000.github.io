# Build ---------------------------------------------------------------------
permalink: pretty
markdown: kramdown
plugins:
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .claude

# Legacy pages below are plain static files (no front matter), so Jekyll copies
# them through untouched and their old URLs keep working:
#   adguard.txt, curecomp/, hitoha/, lewd4dead/, images/, google*.html
# These ones are kept out of sitemap.xml so search engines skip them.
defaults:
  - scope:
      path: lewd4dead
    values:
      sitemap: false
  - scope:
      path: hitoha
    values:
      sitemap: false
  - scope:
      path: google3826fff9a5c8bcdc.html
    values:
      sitemap: false
