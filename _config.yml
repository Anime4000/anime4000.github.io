# Facts that go stale. Update the numbers and the date together.
stats_as_of: November 2026

# Search and social previews ---------------------------------------------
# `seo_title` is the home page's <title>. Other pages set their own
# `seo_title` and `description` in front matter.
seo_title: Anime4000 (Hitoha) — Anime Programming, xPON Freedom, IFME
locale: en_GB
twitter_username: anime4000
# 1200 x 630 card shown when a link is shared on Discord, Telegram, X, etc.
social_image: /assets/img/social-card.png
social_image_alt: >-
  Anime4000 — ひとは☆もえ, Anime Programming. Leading RTL960x xPON hacking,
  Open PON Foundation, IFME, ΕΛΠΙΣ DNS and Pururin Collective.
# Structured data (schema.org Person).
person:
  alternate_names:
    - Hitoha
    - Hitoha Marui
    - ひとは
  knows_about:
    - GPON
    - XGS-PON
    - Passive optical network
    - Reverse engineering
    - Firmware
    - MikroTik RouterOS
