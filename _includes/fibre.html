{% comment %}
  A decorative fibre strand. Two pulses travel in opposite directions, the way
  downstream and upstream light share one strand of glass on a PON.
{% endcomment %}
<div class="fibre" aria-hidden="true">
  <svg viewBox="0 0 1200 60" preserveAspectRatio="none" focusable="false">
    <path class="fibre-glass" pathLength="1000" d="M0 30 C 150 4, 300 56, 450 30 S 750 4, 900 30 S 1100 52, 1200 30"/>
    <path class="fibre-pulse fibre-down" pathLength="1000" d="M0 30 C 150 4, 300 56, 450 30 S 750 4, 900 30 S 1100 52, 1200 30"/>
    <path class="fibre-pulse fibre-up" pathLength="1000" d="M0 30 C 150 4, 300 56, 450 30 S 750 4, 900 30 S 1100 52, 1200 30"/>
  </svg>
</div>
