# Refreshes _data/sponsors.json from GitHub Sponsors once a day, and commits it
# only when the list has changed. The home page reads that file.
name: Update sponsors

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:         # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: sponsors
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch public sponsors
        env:
          # Optional repo secret SPONSORS_TOKEN (a classic token, no scopes
          # needed) is used if set; otherwise the workflow's own token.
          GH_TOKEN: ${{ secrets.SPONSORS_TOKEN || github.token }}
          SPONSORS_LOGIN: ${{ github.repository_owner }}
        run: python3 .github/scripts/fetch_sponsors.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- _data/sponsors.json; then
            echo "Sponsors unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/sponsors.json
          git commit -m "Update sponsors"
          git push
