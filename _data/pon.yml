path:
  - name: OLT
    owner: Operator
    desc: The ISP's end of the fibre, in the exchange.
  - name: Splitter
    owner: Shared
    desc: One fibre, split passively between you and your neighbours.
  - name: ONT
    owner: Yours
    desc: The box on your wall. Closed, locked and rented. This is the part we open.
    open: true
  - name: Router
    owner: Yours
    desc: Everything from here to your LAN, on hardware you chose.

principles:
  - title: Openness
    desc: >-
      Firmware and protocol knowledge developed in the open, so behaviour can
      be audited rather than taken on trust.
  - title: Cross-vendor compatibility
    desc: >-
      One stick that speaks to many OLTs. Interoperability is what makes
      choice real.
  - title: Ease of access
    desc: >-
      Clear guides and tooling that does not demand a lab bench. Knowledge
      locked inside private forums helps no one.
  - title: User-owned equipment
    desc: >-
      Your ONT is part of your network, not an unremovable extension of the
      operator's.
  - title: Privacy
    desc: >-
      No vendor cloud and no silent telemetry. Where an operator mandates
      TR-069, the firmware emulates it and nothing personal leaves.

# Same seven projects as data/firmware.json on openpon.org. `by` is the
# author credit shown under the description.
firmware:
  - name: NIJIKA Firmware
    tech: GPON
    chip: RTL9601 · RTL9607DQ
    badge: my project
    url: https://github.com/Anime4000/RTL960x#nijika-firmware
    by: Anime4000, rajkosto, stich86, O3, et al.
    desc: >-
      NIJIKA for RTL9601CI and RTL9601D sticks: broad OLT compatibility, VEIP,
      1GbE to 2.5GbE, Prometheus and Grafana metrics. NIJIKA-Luna moves it to
      RTL9601 OSS and Linux 6.18 (in development). NijikaWrt runs OpenWrt on
      RTL9607DQ gateways, starting with the D-Link DPN-FX3060V (A1)
      (experimental).
  - name: Peter-Pon
    tech: GPON
    chip: Lantiq Falcon
    by: Pedro Teixeira, Штеуд, wackejohn
    desc: >-
      Firmware for Lantiq Falcon GPON sticks. The team reverse engineered the
      Falcon Packet Engine for hardware PPPoE. PPPoE Half-Bridge is planned.
  - name: CatOS
    tech: GPON
    chip: RTL9601
    by: CATCrypt
    desc: >-
      Firmware for RTL9601 sticks, developed for operator networks in Belarus.
      An alternative to NIJIKA.
  - name: ZRV OS
    tech: GPON
    chip: RTL9602
    by: Ánzelox Zeravlá
    desc: An independent operating system for RTL9602 ONTs, from clean-room reverse engineering.
  - name: RemixWrt IIDX
    tech: GPON
    chip: Airoha EN7581
    badge: Pururin Collective
    url: https://github.com/PururinCollective/sk-g7220-openwrt
    by: Pururin Collective
    desc: >-
      OpenWrt 25.12 and LuCI on Airoha EN7581 ONT gateways, starting with the
      Skyworth SK-G7220. One firmware bank keeps the stock image for recovery.
      Beta (r20).
  - name: "8311"
    tech: XGS-PON
    chip: PRX126
    by: djGrrr, et al.
    desc: The reference open firmware for 10G subscriber deployments.
  - name: CA8271x
    tech: XGS-PON
    chip: CA8271x
    by: YuukiJapanTech
    desc: XGS-PON firmware with a focus on Japanese operator interoperability.

# The three development tracks, by PON SoC vendor. Same as data/platforms.json
# on openpon.org. In `projects`, `tag: mine` marks active work and
# `tag: quiet` marks planned work; no `tag` shows the status outlined.
tracks:
  - name: Lantiq Falcon
    scope: SFP PON
    summary: >-
      GPON SFP sticks on the Lantiq FALC ON SoC. The Peter-Pon team reverse
      engineered the Packet Engine, so PPPoE can run in hardware on the stick.
    specs:
      - label: Hardware
        value: Huawei MA5671A, Nokia G-010S-P, Nokia G-010S-A
      - label: Contributors
        value: Pedro Teixeira, Штеуд, wackejohn
    projects:
      - name: Peter-Pon
        note: SFP firmware
        status: Active
        tag: mine
      - name: Hardware PPPoE
        note: Packet Engine data path
        status: Emulator
        tag: mine
      - name: PPPoE Half-Bridge
        note: Public IPv4 to the router over DHCP
        status: Planned
        tag: quiet
  - name: Realtek
    scope: SFP PON and OpenWrt ONT
    summary: >-
      RTL9601 and RTL9602 SFP sticks, and RTL9607DQ ONT gateways. RTL9601 OSS
      replaces the vendor userland with Linux 6.18 and open switch, GPON and
      OMCI drivers on any RTL9601 stick.
    specs:
      - label: SFP hardware
        value: ODI DFP-34X-2C2, VSOL V2801F, TWC TWCGPON657, Ubiquiti UF-Instant, D-Link DPN-100
      - label: ONT hardware
        value: D-Link DPN-FX3060V (A1)
    projects:
      - name: NIJIKA
        note: SFP firmware, RTL9601CI and RTL9601D
        status: Stable
        url: https://github.com/Anime4000/RTL960x#nijika-firmware
      - name: NIJIKA-Luna
        note: SFP firmware on RTL9601 OSS
        status: In development
        tag: mine
        url: https://github.com/PururinCollective/rtl9601-nijika-ui
      - name: RTL9601 OSS
        note: Open base OS for RTL9601 sticks, by Andre Ziviani
        url: https://github.com/AndreZiviani/odi-oss
      - name: CatOS
        note: SFP firmware, RTL9601
      - name: ZRV OS
        note: SFP firmware, RTL9602
      - name: NijikaWrt
        note: OpenWrt ONT, RTL9607DQ
        status: Experimental
        tag: mine
        url: https://github.com/PururinCollective/dpn-fx3060v-a1-openwrt
  - name: MediaTek
    scope: OpenWrt ONT, BPI-R4 + PON stick
    summary: >-
      OpenWrt on Airoha EN7581 ONT gateways, and the Banana Pi BPI-R4 as an
      OpenWrt host for a GPON or XGS-PON stick in its SFP+ cage.
    specs:
      - label: ONT hardware
        value: Skyworth SK-G7220 (Airoha EN7581, Wi-Fi 7)
      - label: Host hardware
        value: Banana Pi BPI-R4 (Filogic 880, 2x SFP+)
    projects:
      - name: RemixWrt IIDX
        note: OpenWrt and LuCI, Airoha EN7581
        status: Beta
        tag: mine
        url: https://github.com/PururinCollective/sk-g7220-openwrt
      - name: BPI-R4 + PON stick
        note: OpenWrt host, open firmware on the stick

# The NIJIKA family tree, by silicon vendor. Shown on /pon/.
# `next` is a firmware that grew out of its parent. `latest: true` marks
# current work. `links` sit under the description.
lineage:
  - vendor: Realtek
    silicon: RTL9601CI · RTL9601D · RTL9607DQ
    branches:
      - name: NIJIKA Firmware
        kind: ONT firmware
        device: RTL9601CI · RTL9601D
        base: Stock Realtek firmware (230303)
        status: In the field
        desc: >-
          Where the family starts, and what runs on the 1,000+ sticks in the
          field: broad OLT compatibility, VEIP, 1GbE to 2.5GbE, and metrics
          for Prometheus and Grafana, layered on the vendor firmware.
        links:
          - name: RTL960x
            url: https://github.com/Anime4000/RTL960x#nijika-firmware
        next:
          - name: NIJIKA-Luna
            kind: ONT firmware, next generation
            device: RTL9601D
            base: RTL9601 OSS · Linux 6.18
            status: In development
            latest: true
            desc: >-
              NIJIKA rebuilt on Andre Ziviani's RTL9601 OSS, with open switch,
              GPON and OMCI drivers in place of the vendor's. A nijika CLI
              rewritten in C, ONT identity presets with the Huawei HG8240H as
              the default, and Nijika UI: a LuCI-style page that draws the
              line, the services and the OMCI topology, says what each change
              costs before you save it, and updates firmware with a trial boot
              that falls back by itself.
            links:
              - name: Nijika UI
                url: https://github.com/PururinCollective/rtl9601-nijika-ui
      - name: NijikaWrt
        kind: Gateway firmware
        device: D-Link DPN-FX3060V (A1)
        base: OpenWrt 25.12 · stock Realtek 5.10 kernel
        status: Experimental
        latest: true
        desc: >-
          OpenWrt and LuCI on a whole RTL9607DQ GPON gateway. The stock
          userland keeps driving PON, OMCI, WAN, Wi-Fi and voice from a
          chroot, while OpenWrt adds WireGuard, DNS over HTTPS and DDNS, and
          D-Link's cloud agent is removed. A1 hardware only.
        links:
          - name: Source
            url: https://github.com/PururinCollective/dpn-fx3060v-a1-openwrt
  - vendor: MediaTek
    silicon: Airoha EN7581 · EcoNet SDK
    branches:
      - name: RemixWrt IIDX
        kind: Gateway firmware
        device: Skyworth SK-G7220 (Wi-Fi 7)
        base: OpenWrt 25.12.6 · stock EcoNet 5.4 kernel
        status: Beta · r20
        latest: true
        desc: >-
          The same idea on MediaTek silicon: the stock pages rebuilt in LuCI,
          a RemixWrt menu for ONT authentication, identity and OMCI topology,
          WireGuard, encrypted DNS and a Quick Setup page. One firmware bank
          always keeps the stock image, so there is a way back.
        links:
          - name: Source
            url: https://github.com/PururinCollective/sk-g7220-openwrt
          - name: r20 release
            url: https://github.com/PururinCollective/sk-g7220-openwrt/releases/tag/r20

timeline:
  - date: "2020"
    title: Research begins
    desc: >-
      The year of the pandemic. With developers and hackers staying at home,
      the research into GPON sticks starts.
  - date: February 2021
    title: RTL960x goes public
    desc: >-
      The repository opens on GitHub to document Realtek GPON SFP sticks such
      as the V2801F, TWCGPON657 and DFP-34X-2C2.
  - date: August 2022
    title: 2 Gbps on Unifi, before Unifi sold it
    desc: >-
      Nearly 2 Gbps through one GPON stick on TM Unifi, using four 800 Mbps
      PPPoE accounts, well ahead of any official 2 Gbps plan. Contributors
      elsewhere report 2.5GbE links on their own operators.
  - date: March 2025
    title: Programmers for everyone
    desc: >-
      SFP-Master and IMSProg are ported to Windows, so a cheap CH341a is
      enough to read and write a stick's EEPROM and flash.
  - date: March 2026
    title: A NOC on your desk
    desc: >-
      A guide to building an ISP-style NOC dashboard at home with Grafana and
      Prometheus, fed by metrics from NIJIKA.
  - date: May 2026
    title: Pururin Collective opens
    desc: >-
      A forum for the informal side: ISP-specific tweaks, experiments and
      troubleshooting. GitHub stays vendor-neutral.
  - date: September 2026
    title: Open PON Foundation
    desc: >-
      The scattered work gets a shared front door at openpon.org, and a name
      that can put the subscriber's case to a regulator.
  - date: Late 2026
    title: Beyond the stick
    desc: >-
      NIJIKA-Luna moves NIJIKA onto RTL9601 OSS and Linux 6.18.
      NijikaWrt and RemixWrt IIDX bring an OpenWrt userland to whole
      gateways, on Realtek RTL9607DQ and MediaTek (Airoha) SoCs. CatOS and
      Peter-Pon widen the choice of firmware for sticks, and the Peter-Pon
      team opens up the Lantiq Falcon Packet Engine for hardware PPPoE.
      Open PON development settles into three tracks: Lantiq Falcon,
      Realtek and MediaTek.

