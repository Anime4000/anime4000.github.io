# TM Unifi at 2 Gbps. Shown on /pon/ next to the screenshot.
unifi:
  - when: August 2022
    title: 2 Gbps before the plan existed
    desc: >-
      Nearly 2 Gbps through a single GPON stick, using four 800 Mbps PPPoE
      accounts — before Unifi had released a 2 Gbps plan at all.
    url: https://forum.lowyat.net/index.php?showtopic=4925452&st=500&p=105123186&#entry105123186
    link: The post on Lowyat.NET
  - when: Launch day
    title: The 1+1 plan, solved
    desc: >-
      When Unifi released its 2 Gbps plan it was advertised as 1+1. I solved
      it on the first day, so a subscriber gets true 2 Gbps instead.
resellers: CureComp, SUBTel and Perfect
