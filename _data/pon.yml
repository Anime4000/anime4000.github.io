    label: GitHub stars on RTL960x
    repo: Anime4000/RTL960x
  - value: "19"
    label: countries with working deployments
  - value: "14"
    label: contributors credited by name
  - value: "7"
    label: open firmware projects

path:
  - name: OLT
    owner: Operator
    desc: The ISP's end of the fibre, in the exchange.
  - name: Splitter
    owner: Shared
    desc: One fibre, split passively between you and your neighbours.
  - name: ONT
    owner: Yours
    desc: The box on your wall. Closed, locked, rented — this is the part we open.
    open: true
  - name: Router
    owner: Yours
    desc: Everything from here to your LAN, on hardware you chose.

principles:
  - title: Openness
    desc: >-
      Firmware and protocol knowledge developed in the open, so behaviour can
      be audited rather than taken on trust.
  - title: Cross-vendor compatibility
    desc: >-
      One stick that speaks to many OLTs. Interoperability is what makes
      choice real.
  - title: Ease of access
    desc: >-
      Clear guides and tooling that does not demand a lab bench. Knowledge
      locked inside private forums helps no one.
  - title: User-owned equipment
    desc: >-
      Your ONT is part of your network, not an unremovable extension of the
      operator's.
  - title: Privacy
    desc: >-
      No vendor cloud and no silent telemetry. Where an operator mandates
      TR-069, the firmware emulates it and nothing personal leaves.

firmware:
  - name: NIJIKA Firmware / NijikaWrt
    tech: GPON
    chip: RTL960x
    badge: my project
    url: https://github.com/PururinCollective/dpn-fx3060v-a1-openwrt
    desc: >-
      NIJIKA for Realtek sticks: broad OLT compatibility, VEIP, 1GbE to 2.5GbE,
      Prometheus and Grafana metrics. NijikaWrt takes it further with an
      OpenWrt userland for RTL9607DQ gateways, starting with the D-Link
      DPN-FX3060V (A1). Experimental.
  - name: RemixWrt IIDX
    tech: GPON
    chip: EcoNet
    badge: Pururin Collective
    url: https://github.com/PururinCollective/sk-g7220-openwrt
    desc: >-
      OpenWrt and LuCI for EcoNet PON SoCs, starting with the Skyworth
      SK-G7220 gateway. Beta.
  - name: CatOS
    tech: GPON
    chip: RTL9601CI · RTL9601D
    desc: An alternative to NIJIKA for RTL9601CI and RTL9601D sticks.
  - name: Peter-Pon
    tech: GPON
    chip: Lantiq
    desc: Firmware for sticks built on Lantiq SoCs.
  - name: ZRV OS
    tech: GPON
    chip: RTL9602
    desc: An independent operating system born out of clean-room reverse engineering.
  - name: "8311"
    tech: XGS-PON
    chip: PRX126
    desc: The reference open firmware for 10G subscriber deployments.
  - name: CA8271x
    tech: XGS-PON
    chip: CA8271x
    desc: XGS-PON firmware with a focus on Japanese operator interoperability.

timeline:
  - date: "2020"
    title: Research begins
    desc: >-
      The year of the pandemic. With developers and hackers staying at home,
      the research into GPON sticks starts.
  - date: February 2021
    title: RTL960x goes public
    desc: >-
      The repository opens on GitHub to document Realtek GPON SFP sticks such
      as the V2801F, TWCGPON657 and DFP-34X-2C2.
  - date: "2022"
    title: 2.5GbE over a stick
    desc: >-
      Contributors report stock ONTs replaced and 2.5GbE links running on
      real operators, from Italy to TM Unifi in Malaysia.
  - date: March 2025
    title: Programmers for everyone
    desc: >-
      SFP-Master and IMSProg are ported to Windows, so a cheap CH341a is
      enough to read and write a stick's EEPROM and flash.
  - date: March 2026
    title: A NOC on your desk
    desc: >-
      A guide to building an ISP-style NOC dashboard at home with Grafana and
      Prometheus, fed by metrics from NIJIKA.
  - date: May 2026
    title: Pururin Collective opens
    desc: >-
      A forum for the informal side — ISP-specific tweaks, experiments and
      troubleshooting — so GitHub can stay vendor-neutral.
  - date: September 2026
    title: Open PON Foundation
    desc: >-
      The scattered work gets a shared front door at openpon.org, and a name
      that can put the subscriber's case to a regulator.
  - date: Late 2026
    title: Beyond the stick
    desc: >-
      NijikaWrt and RemixWrt IIDX bring an OpenWrt userland to whole
      gateways, on Realtek RTL9607DQ and EcoNet SoCs. CatOS and Peter-Pon
      widen the choice of firmware for sticks.

