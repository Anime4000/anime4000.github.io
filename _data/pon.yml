path:
  - name: OLT
    owner: Operator
    desc: The ISP's end of the fibre, in the exchange.
  - name: Splitter
    owner: Shared
    desc: One fibre, split passively between you and your neighbours.
  - name: ONT
    owner: Yours
    desc: The box on your wall. Closed, locked, rented — this is the part we open.
    open: true
  - name: Router
    owner: Yours
    desc: Everything from here to your LAN, on hardware you chose.

principles:
  - title: Openness
    desc: >-
      Firmware and protocol knowledge developed in the open, so behaviour can
      be audited rather than taken on trust.
  - title: Cross-vendor compatibility
    desc: >-
      One stick that speaks to many OLTs. Interoperability is what makes
      choice real.
  - title: Ease of access
    desc: >-
      Clear guides and tooling that does not demand a lab bench. Knowledge
      locked inside private forums helps no one.
  - title: User-owned equipment
    desc: >-
      Your ONT is part of your network, not an unremovable extension of the
      operator's.
  - title: Privacy
    desc: >-
      No vendor cloud and no silent telemetry. Where an operator mandates
      TR-069, the firmware emulates it and nothing personal leaves.

firmware:
  - name: NIJIKA Firmware / NijikaWrt
    tech: GPON
    chip: RTL960x
    badge: my project
    url: https://github.com/PururinCollective/dpn-fx3060v-a1-openwrt
    desc: >-
      NIJIKA for Realtek sticks: broad OLT compatibility, VEIP, 1GbE to 2.5GbE,
      Prometheus and Grafana metrics. NijikaWrt takes it further with an
      OpenWrt userland for RTL9607DQ gateways, starting with the D-Link
      DPN-FX3060V (A1). Experimental.
  - name: RemixWrt IIDX
    tech: GPON
    chip: Airoha EN7581
    badge: Pururin Collective
    url: https://github.com/PururinCollective/sk-g7220-openwrt
    desc: >-
      OpenWrt and LuCI for MediaTek's Airoha PON SoCs, starting with the
      Skyworth SK-G7220 gateway. Beta.
  - name: CatOS
    tech: GPON
    chip: RTL9601CI · RTL9601D
    desc: An alternative to NIJIKA for RTL9601CI and RTL9601D sticks.
  - name: Peter-Pon
    tech: GPON
    chip: Lantiq
    desc: Firmware for sticks built on Lantiq SoCs.
  - name: ZRV OS
    tech: GPON
    chip: RTL9602
    desc: An independent operating system born out of clean-room reverse engineering.
  - name: "8311"
    tech: XGS-PON
    chip: PRX126
    desc: The reference open firmware for 10G subscriber deployments.
  - name: CA8271x
    tech: XGS-PON
    chip: CA8271x
    desc: XGS-PON firmware with a focus on Japanese operator interoperability.

# The NIJIKA family tree, by silicon vendor. Shown on /pon/.
# `next` is a firmware that grew out of its parent. `latest: true` marks
# current work. `links` sit under the description.
lineage:
  - vendor: Realtek
    silicon: RTL9601CI · RTL9601D · RTL9607DQ
    branches:
      - name: NIJIKA Firmware
        kind: ONT firmware
        device: RTL9601CI · RTL9601D
        base: Stock Realtek firmware (230303)
        status: In the field
        desc: >-
          Where the family starts, and what runs on the 1,000+ sticks in the
          field: broad OLT compatibility, VEIP, 1GbE to 2.5GbE, and metrics
          for Prometheus and Grafana, layered on the vendor firmware.
        links:
          - name: RTL960x
            url: https://github.com/Anime4000/RTL960x#nijika-firmware
        next:
          - name: NIJIKA Luna
            kind: ONT firmware, next generation
            device: RTL9601D
            base: ODI OSS · Linux 6.18
            status: In development
            latest: true
            desc: >-
              NIJIKA rebuilt on Andre Ziviani's ODI OSS, with open switch,
              GPON and OMCI drivers in place of the vendor's. A nijika CLI
              rewritten in C, ONT identity presets with the Huawei HG8240H as
              the default, and Nijika UI: a LuCI-style page that draws the
              line, the services and the OMCI topology, says what each change
              costs before you save it, and updates firmware with a trial boot
              that falls back by itself.
            links:
              - name: Nijika UI
                url: https://github.com/PururinCollective/rtl9601-nijika-ui
      - name: NijikaWrt
        kind: Gateway firmware
        device: D-Link DPN-FX3060V (A1)
        base: OpenWrt 25.12 · stock Realtek 5.10 kernel
        status: Experimental
        latest: true
        desc: >-
          OpenWrt and LuCI on a whole RTL9607DQ GPON gateway. The stock
          userland keeps driving PON, OMCI, WAN, Wi-Fi and voice from a
          chroot, while OpenWrt adds WireGuard, DNS over HTTPS and DDNS, and
          D-Link's cloud agent is removed. A1 hardware only.
        links:
          - name: Source
            url: https://github.com/PururinCollective/dpn-fx3060v-a1-openwrt
  - vendor: MediaTek
    silicon: Airoha EN7581 · EcoNet SDK
    branches:
      - name: RemixWrt IIDX
        kind: Gateway firmware
        device: Skyworth SK-G7220 (Wi-Fi 7)
        base: OpenWrt 25.12.6 · stock EcoNet 5.4 kernel
        status: Beta · r20
        latest: true
        desc: >-
          The same idea on MediaTek silicon: the stock pages rebuilt in LuCI,
          a RemixWrt menu for ONT authentication, identity and OMCI topology,
          WireGuard, encrypted DNS and a Quick Setup page. One firmware bank
          always keeps the stock image, so there is a way back.
        links:
          - name: Source
            url: https://github.com/PururinCollective/sk-g7220-openwrt
          - name: r20 release
            url: https://github.com/PururinCollective/sk-g7220-openwrt/releases/tag/r20

timeline:
  - date: "2020"
    title: Research begins
    desc: >-
      The year of the pandemic. With developers and hackers staying at home,
      the research into GPON sticks starts.
  - date: February 2021
    title: RTL960x goes public
    desc: >-
      The repository opens on GitHub to document Realtek GPON SFP sticks such
      as the V2801F, TWCGPON657 and DFP-34X-2C2.
  - date: August 2022
    title: 2 Gbps on Unifi, before Unifi sold it
    desc: >-
      Nearly 2 Gbps through one GPON stick on TM Unifi, using four 800 Mbps
      PPPoE accounts, well ahead of any official 2 Gbps plan. Contributors
      elsewhere report 2.5GbE links on their own operators.
  - date: March 2025
    title: Programmers for everyone
    desc: >-
      SFP-Master and IMSProg are ported to Windows, so a cheap CH341a is
      enough to read and write a stick's EEPROM and flash.
  - date: March 2026
    title: A NOC on your desk
    desc: >-
      A guide to building an ISP-style NOC dashboard at home with Grafana and
      Prometheus, fed by metrics from NIJIKA.
  - date: May 2026
    title: Pururin Collective opens
    desc: >-
      A forum for the informal side — ISP-specific tweaks, experiments and
      troubleshooting — so GitHub can stay vendor-neutral.
  - date: September 2026
    title: Open PON Foundation
    desc: >-
      The scattered work gets a shared front door at openpon.org, and a name
      that can put the subscriber's case to a regulator.
  - date: Late 2026
    title: Beyond the stick
    desc: >-
      NIJIKA Luna moves NIJIKA onto ODI OSS and Linux 6.18.
      NijikaWrt and RemixWrt IIDX bring an OpenWrt userland to whole
      gateways, on Realtek RTL9607DQ and MediaTek (Airoha) SoCs. CatOS and
      Peter-Pon widen the choice of firmware for sticks.

