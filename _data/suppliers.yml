# Regional suppliers, mirrored from openpon.org (data/suppliers.json).
# Shown on /pon/#suppliers. Update `as_of` when you sync it.
as_of: November 2026
source: https://www.openpon.org/#suppliers

tiers:
  msp:
    label: Managed IT · MSP
    desc: >-
      Handles the full deployment: fibre, ONT, routing and access points.
      All equipment is procured in the customer's name.
  trade:
    label: Trade supply
    desc: >-
      Business that sells hardware. Deployment is done by the buyer or the
      buyer's integrator.
  community:
    label: Community supply
    desc: >-
      Individual who supplies sticks and firmware help on a voluntary basis.
      No support contract applies.

