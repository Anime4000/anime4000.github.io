# Milestones.
timeline:
  - date: "2012"
    title: An idea at APU
    desc: >-
      A student at Asia Pacific University in Kuala Lumpur, with a hard disk full
      of raw FRAPS game recordings.
  - date: Apr 2013
    title: x264ui
    desc: >-
      A small VB.NET window in front of x264 that made those recordings small
      enough to keep.
  - date: Oct 2013
    title: IFME 1.0 “Mirai Hikari”
    desc: >-
      x264ui grows audio and an early x265, and gets a name. Version 2 adds
      queue encoding, a debug console and automatic updates.
  - date: Jan 2014
    title: 3.0, the first installer
    desc: >-
      64-bit only on .NET 4.0. Subtitles and font attachments, 10-bit encoding,
      multiple audio streams, and in 3.1 the first translations: Chinese,
      Indonesian, Japanese, Malay and Norwegian.
  - date: Jul 2014
    title: 4.0, rewritten in C#
    desc: >-
      Totally new code, and the first version in Git. Add-ons, an updater for
      each encoder, CPU affinity and priority, and translation files anyone can
      edit.
  - date: Sep 2015
    title: 5.0 “IFME Go”
    desc: >-
      Rewritten again, better and faster. Native AviSynth, 12-bit encoding,
      command-line encoding from a saved queue, and IFME running natively on
      Linux for the first time.
  - date: Jan 2016
    title: 6.0 “Archangel Descending”
    desc: >-
      Plugins identified by GUID, audio file encoding, custom FFmpeg arguments
      and TrueType collections embedded in the output.
  - date: Jun 2017
    title: 7.0 “Eridanus”
    desc: >-
      A complete rewrite on JSON instead of INI, with audio-only encoding. 7.3
      learns to take fonts from another video.
  - date: Apr 2020
    title: 20.04, rebuilt from scratch
    desc: >-
      .NET 4.8 and the console moved inside the window. The 21.x alphas add
      NVENC and taking subtitles from another video.
  - date: Oct 2022
    title: 8.0 beta
    desc: >-
      The eighth and final rebuild of the interface: select the whole queue and
      set it once. Fast remux and folder import arrive for Jellyfin and Plex
      libraries.
  - date: Feb 2024
    title: 8.1, out of beta
    desc: >-
      Styled subtitles burned in without fonts.conf — found by reading
      Jellyfin's FFmpeg logs. rigaya's NVEnc, AVX2 builds of x264 and x265, and
      automatic letterbox cropping came with the last betas.
  - date: May 2025
    title: 8.5 and 8.6, Linux again
    desc: >-
      An interface in Japanese and Chinese, CPU checks at start-up, and IFME 8
      back on Linux under Mono.
  - date: Aug 2026
    title: 8.7 “Mezame no Uta”
    desc: >-
      The encoding engine no longer touches the interface: the groundwork for
      headless and command-line use.
  - date: Nov 2026
    title: 8.7.1 and IFME 9 alpha
    desc: >-
      IFME 9 is a Qt 6 interface on a native C core with a command-line encoder,
      ported from IFME 8 with the help of AI. No .NET, no Mono, same plugins.
    now: true
  - date: Next
    title: IFME 9
    desc: >-
      IFME 9 takes over from IFME 8, on Windows and Linux, without a runtime to
      install first.

