# IFME page. Dates come from changelog.txt, the git history and release tags
# of github.com/Anime4000/IFME.

# What IFME does today.
features:
  - name: Encode
    desc: >-
      x264, x265, SVT-AV1, VVC, VP9 and more, with Opus, FLAC, AAC and the rest
      for audio. Every encoder is a JSON plugin you can update yourself.
  - name: Remux
    desc: >-
      Repackage streams without re-encoding, like MKVToolNix. Smart stream copy
      only encodes what the new container cannot hold.
  - name: Borrow from another video
    desc: >-
      Take subtitles and fonts straight out of another file. Put a fansub's
      styled subtitles onto a better raw without extracting anything first.
  - name: Blu-ray to small
    desc: >-
      Keep the disc, and encode the copy you watch to x265 or AV1 with FLAC or
      Opus for the smallest file that still looks right.
  - name: Batch a whole library
    desc: >-
      Import a folder, set it once, walk away. Built for Jellyfin and Plex
      collections, including the files they cannot play.
  - name: MP4 that keeps its subtitles
    desc: >-
      Put SRT or VTT subtitles inside an MP4, or burn styled ones into the
      picture for players that cannot show them.
  - name: GPU when you want it
    desc: NVENC, Intel Quick Sync and AMD AMF, through rigaya's encoders or FFmpeg.

# Version 8's queue: set everything once, for every selected file.
harmony:
  - title: Select the whole queue
    desc: Ten files or a full season. Every setting below applies to all of them.
  - title: Pick the encoder
    desc: x265 on the CPU, or rigaya's NVEnc and QSVEnc on the GPU.
  - title: Auto resolution
    desc: No upscaling, no downscaling. Each file keeps its own size.
  - title: 8-bit
    desc: Plays on every phone, TV and browser.
  - title: 4:2:0 chroma
    desc: The format every hardware decoder expects.
  - title: CRF, tune and the rest — once
    desc: Quality and speed set one time, not file by file.
  - title: Audio codec, sample rate, compression level
    desc: Every audio track in every file follows the same settings.

